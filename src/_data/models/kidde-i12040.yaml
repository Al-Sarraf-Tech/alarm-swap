    checked: "2026-10-31"
  - id: fault
    label: Sensor-fault signal
    value: "A chirp about 20 seconds after the red LED flashes means the smoke-sensing chamber is not working normally. The guide says to replace the alarm. That signal is separate from the low-battery chirp every 30-40 seconds"
    source_url: https://brand.kidde.com/m/79d343435488dfc/original/Product_UG_i12040A-i12080A-User-Guide_En.pdf
    source_title: "Kidde — i12040A / i12080A Smoke Alarm User Guide (PDF)"
