replacement:
  - id: named-replacement
    label: Replacement named by Kidde
    value: "Kidde's i12040 page did not name a replacement model when we checked. Kidde's replacement guide says discontinued models show their replacement on the product page found through its model search."
    source_url: https://www.kidde.com/support/smoke-alarms/alarm-replacement-guide
    source_title: "Kidde — Alarm Replacement Guide"
    checked: "2026-10-31"
  - id: adapter
    label: Keep the old wiring plug
    value: "The 20-9003 adapter guide lists i12040 and i12040A as older Kidde harnesses it can connect to a new Kidde alarm with the newer connector"
    source_url: https://brand.kidde.com/m/275e008037c43807/original/Product_UG_20-9003.pdf
    source_title: "Kidde — 20-9003 Wiring Adapter User Guide (PDF)"
    checked: "2026-10-31"
  - id: adapter-not-universal
    label: Check the pairing first
    value: "Kidde warns the adapter only works for listed old/new model pairs; do not go by plug shape or brand alone"
    source_url: https://www.kidde.com/products/safety-accessories/quick-connect-adapter-for-hardwired-smoke-carbon-monoxide-alarms
    source_title: "Kidde — Quick Connect Adapter 20-9003 (product page)"
    checked: "2026-10-31"
  - id: other-brands
    label: Mixing brands on one loop
    value: "Only alarms on Kidde's tested list should share the interconnect wire; Kidde says unlisted equipment could cause nuisance alarms, failure to alarm, or damage"
