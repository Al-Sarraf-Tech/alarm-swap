title: "Kidde i12040 / i12040A: age, expiry and what replaces it"
description: "Kidde i12040 hardwired ionization smoke alarm with Hush: date code location, ten-year replacement, approved 9 V backup batteries, interconnect limits and the 20-9003 plug adapter."
published: "2026-10-31"
summary: >-
  Kidde's hardwired ionization smoke alarm with a single Test/Hush button and a
  9-volt backup battery. It shares a user guide with the i12080A (the same alarm
  plus a battery-powered safety light). Replace it ten years after the date code
  on its back; the 20-9003 adapter lets a newer Kidde alarm reuse its wiring plug.
  A chirp about 20 seconds after the red LED flashes is a sensing-chamber
  fault, and the guide says to replace the alarm.
