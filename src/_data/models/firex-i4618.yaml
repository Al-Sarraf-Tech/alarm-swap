slug: firex-i4618
brand: Firex
model: i4618
aliases: [i4618A, i4618AC]
kind: Hardwired smoke alarm
title: "Firex i4618 / i4618AC: discontinued — what replaces it"
description: "Firex i4618 and i4618AC hardwired ionization smoke alarms are discontinued. Kidde's named upgrade (20SAR), the 20-9003 adapter for the old Firex plug, interconnect notes and the ten-year rule."
published: "2026-10-31"
summary: >-
  Firex is a brand Kidde took over; Kidde now lists the i4618AC as discontinued
  and points to its 20SAR hardwired alarm as the upgrade. Kidde's 20-9003 adapter
  names the i4618 family among the older plugs it can connect to a newer Kidde
  alarm, so the ceiling wiring can usually stay — confirm the exact pairing first.
