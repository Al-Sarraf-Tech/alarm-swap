summary: >-
  A hardwired ionization smoke alarm from Kidde with a front-loading 9-volt
  backup battery. If yours is ten years past the date code on its back, it is
  due for replacement. Kidde sells a plug adapter (20-9003) so a newer Kidde
  alarm can use the wiring plug already in your ceiling.
